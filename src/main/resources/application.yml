spring:
  application:
    name: ai-code-reviewer

  datasource:
    url: jdbc:postgresql://localhost:5433/code_reviewer
    username: reviewer
    password: reviewer
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  server:
    port: 8080
  
  management:
    endpoints:
      web:
        exposure:
          include: health, info
